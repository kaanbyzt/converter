{% extends "mikrotik_base.html" %}
{% block title %}{{ t('mk_log.title') }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ t('mk_log.h1') }}</h1>
    <p>{{ t('mk_log.desc') }}</p>
</div>
<div class="tool-grid">
    <div class="card card-space">
        <div>
            <label class="form-label">{{ t('mk_log.alert_label') }}</label>
            <select id="alert" class="form-select" onchange="update()">
                <option value="error">{{ t('mk_log.opt_error') }}</option>
                <option value="critical">{{ t('mk_log.opt_critical') }}</option>
                <option value="warning">{{ t('mk_log.opt_warning') }}</option>
                <option value="account">{{ t('mk_log.opt_account') }}</option>
            </select>
        </div>
        <div>
            <label class="form-label">{{ t('mk_log.action_label') }}</label>
            <select id="action" class="form-select" onchange="toggleAction()">
                <option value="email">{{ t('mk_log.opt_email') }}</option>
                <option value="telegram">{{ t('mk_log.opt_telegram') }}</option>
            </select>
        </div>
        <div>
            <label class="form-label" id="contact-label">{{ t('mk_log.contact_label_email') }}</label>
            <input type="text" id="contact" class="form-input" value="admin@firma.com" oninput="update()">
        </div>
    </div>
    <div class="script-card">
        <div class="script-header">
            <div class="script-title"><span class="dot"></span> {{ t('mk_log.script_title') }}</div>
            <button class="copy-btn" onclick="copy()">{{ t('mk_log.copy') }}</button>
        </div>
        <p class="script-warn">{{ t('mk_log.review_warning') }}</p>
        <pre id="out" class="script-pre"></pre>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function toggleAction() {
    const a = document.getElementById('action').value;
    const lbl = document.getElementById('contact-label');
    const inp = document.getElementById('contact');
    if (a === 'email') { lbl.textContent = {{ t('mk_log.contact_label_email')|tojson }}; inp.value = 'admin@firma.com'; }
    else { lbl.textContent = {{ t('mk_log.contact_label_telegram')|tojson }}; inp.value = 'CHAT_ID'; }
    update();
}
function update() {
    const alert = document.getElementById('alert').value;
    const action = document.getElementById('action').value;
    const contact = document.getElementById('contact').value;
    let s = `# ${ {{ t('mk_log.c1_title')|tojson }} }\n/system script\nadd name="Log_Uyarici" source={\n  :local logMessage "";\n  :foreach i in=[/log find topics~"${alert}"] do={\n    :set logMessage [/log get $i message];\n  }\n  :if ($logMessage != "") do={\n`;
    if (action === 'email') {
        s += `    /tool e-mail send to="${contact}" subject="MikroTik ${ {{ t('mk_log.email_subject_label')|tojson }} }: ${alert.toUpperCase()}" body=$logMessage;\n`;
    } else {
        s += `    /tool fetch url="https://api.telegram.org/botBOT_TOKEN_BURAYA/sendMessage?chat_id=${contact}&text=MikroTik+${ {{ t('mk_log.telegram_error_label')|tojson }} }:+$logMessage" keep-result=no;\n`;
    }
    s += `  }\n}\n\n# ${ {{ t('mk_log.c2_title')|tojson }} }\n/system scheduler\nadd interval=5m name="Log_Kontrol_Zamanlayici" on-event="Log_Uyarici" start-time=startup\n`;
    document.getElementById('out').textContent = s;
}
function copy() {
    navigator.clipboard.writeText(document.getElementById('out').textContent);
    const btn = document.querySelector('.copy-btn');
    btn.textContent = {{ t('mk_log.copied')|tojson }}; setTimeout(() => btn.textContent = {{ t('mk_log.copy')|tojson }}, 1500);
}
update();
</script>
{% endblock %}
