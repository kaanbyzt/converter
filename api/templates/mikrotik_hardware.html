{% extends "mikrotik_base.html" %}
{% block title %}{{ t('mk_hardware.title') }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ t('mk_hardware.h1') }}</h1>
    <p>{{ t('mk_hardware.desc') }}</p>
</div>
<p class="script-warn">{{ t('mk_hardware.top_warning') }}</p>
<div class="tool-grid-4">
    <div class="card card-space">
        <div>
            <label class="form-label">{{ t('mk_hardware.type_label') }}</label>
            <select id="type" class="form-select" onchange="filter()">
                <option value="all">{{ t('mk_hardware.opt_all') }}</option>
                <option value="home-office">{{ t('mk_hardware.opt_home') }}</option>
                <option value="medium-business">{{ t('mk_hardware.opt_medium') }}</option>
                <option value="enterprise">{{ t('mk_hardware.opt_enterprise') }}</option>
            </select>
        </div>
        <div class="form-divider"></div>
        <label class="checkbox-row">
            <input type="checkbox" id="sfp" onchange="filter()">
            <span>{{ t('mk_hardware.sfp_chk') }}</span>
        </label>
    </div>
    <div>
        <h2 id="count-title" style="font-size:1rem;font-weight:600;color:#f9fafb;margin-bottom:1rem;">{{ t('mk_hardware.count_title') }}</h2>
        <div id="devices"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const DEVICES = [
    { model:"hEX (RB750Gr3)", type:"home-office", ports:"1G", sfp:{{ t('mk_hardware.sfp_none')|tojson }}, ipsec:{{ t('mk_hardware.ipsec_var')|tojson }}, desc:{{ t('mk_hardware.d1')|tojson }} },
    { model:"hAP ax3", type:"home-office", ports:"1G & 2.5G", sfp:{{ t('mk_hardware.sfp_none')|tojson }}, ipsec:{{ t('mk_hardware.ipsec_var')|tojson }}, desc:{{ t('mk_hardware.d2')|tojson }} },
    { model:"RB4011 iGS+RM", type:"medium-business", ports:"1G", sfp:"1x 10G SFP+", ipsec:{{ t('mk_hardware.ipsec_cok_guclu')|tojson }}, desc:{{ t('mk_hardware.d3')|tojson }} },
    { model:"RB5009 UG+S+IN", type:"medium-business", ports:"1G & 2.5G", sfp:"1x 10G SFP+", ipsec:{{ t('mk_hardware.ipsec_mukemmel')|tojson }}, desc:{{ t('mk_hardware.d4')|tojson }} },
    { model:"CCR2004-16G-2S+", type:"enterprise", ports:"1G", sfp:"2x 10G SFP+", ipsec:{{ t('mk_hardware.ipsec_donanimsal')|tojson }}, desc:{{ t('mk_hardware.d5')|tojson }} },
    { model:"CCR2116-12G-4S+", type:"enterprise", ports:"1G", sfp:"4x 10G SFP+", ipsec:{{ t('mk_hardware.ipsec_ultra_guclu')|tojson }}, desc:{{ t('mk_hardware.d6')|tojson }} },
];
function filter() {
    const t = document.getElementById('type').value;
    const needSfp = document.getElementById('sfp').checked;
    const list = DEVICES.filter(d => {
        const tm = t === 'all' || d.type === t;
        const sm = !needSfp || d.sfp !== {{ t('mk_hardware.sfp_none')|tojson }};
        return tm && sm;
    });
    document.getElementById('count-title').textContent = `${ {{ t('mk_hardware.count_title')|tojson }} } (${list.length})`;
    const cont = document.getElementById('devices');
    if (list.length === 0) {
        cont.innerHTML = `<div class="empty-state">${ {{ t('mk_hardware.empty_state')|tojson }} }</div>`;
        return;
    }
    cont.innerHTML = list.map(d => `
        <div class="device-card">
            <div class="device-header">
                <div class="device-model">${d.model}</div>
                <div class="device-type">${d.type.replace('-',' ')}</div>
            </div>
            <div class="device-desc">${d.desc}</div>
            <div class="device-specs">
                <div class="spec-block"><small>${ {{ t('mk_hardware.port_speeds_label')|tojson }} }</small><span>${d.ports}</span></div>
                <div class="spec-block"><small>${ {{ t('mk_hardware.sfp_support_label')|tojson }} }</small><span>${d.sfp}</span></div>
                <div class="spec-block"><small>${ {{ t('mk_hardware.ipsec_label')|tojson }} }</small><span class="val-green">${d.ipsec}</span></div>
            </div>
        </div>
    `).join('');
}
filter();
</script>
{% endblock %}
