{% extends "base.html" %}
{% block title %}{{ error_title }} | toolboxquick{% endblock %}
{% block content %}
<section class="tool-card p-4 p-md-5 text-center my-4">
    <div style="font-size: 3rem;" aria-hidden="true">{{ error_icon }}</div>
    <h1 class="mb-2" style="font-size: 1.8rem; font-weight: 700;">{{ error_title }}</h1>
    <p class="text-secondary mb-4">{{ error_message }}</p>
    <a href="/araclar" class="btn btn-primary px-4">{{ t('error.back_to_tools') }}</a>
</section>
{% endblock %}
