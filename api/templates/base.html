<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}toolboxquick | Online Tools &amp; Converters{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        :root {
            --bg-color: #05060a;
            --text-color: #f5f5f5;
            --text-secondary: #9ca3af;
            --navbar-bg: radial-gradient(circle at top left, #1f2937, #020617);
            --navbar-border: rgba(148, 163, 184, 0.25);
            --card-bg: radial-gradient(circle at top left, #111827, #020617);
            --card-border: rgba(148, 163, 184, 0.2);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --btn-outline-border: rgba(148, 163, 184, 0.3);
            --btn-outline-color: #cbd5e1;
            --btn-outline-hover-bg: rgba(148, 163, 184, 0.1);
            --input-bg: #111827;
            --input-border: #374151;
            --input-text: #f5f5f5;
            --footer-border: #1f2937;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --text-secondary: #475569;
            --navbar-bg: #ffffff;
            --navbar-border: rgba(148, 163, 184, 0.15);
            --card-bg: #ffffff;
            --card-border: rgba(148, 163, 184, 0.15);
            --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            --btn-outline-border: #cbd5e1;
            --btn-outline-color: #475569;
            --btn-outline-hover-bg: #f1f5f9;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-text: #0f172a;
            --footer-border: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: var(--navbar-bg);
            border-bottom: 1px solid var(--navbar-border);
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--text-color) !important;
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--btn-outline-border);
            color: var(--btn-outline-color);
            border-radius: 8px;
            padding: 0.35rem 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }
        .theme-toggle-btn:hover {
            background-color: var(--btn-outline-hover-bg);
        }

        .tool-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            transition: transform 0.18s ease-out, box-shadow 0.18s ease-out, border-color 0.18s ease-out, background 0.25s ease;
        }

        .footer {
            border-top: 1px solid var(--footer-border);
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: auto;
            transition: border-color 0.25s ease;
        }

        /* Forms styling */
        .form-control, .form-select {
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--input-text);
        }
        .form-control:focus, .form-select:focus {
            background-color: var(--input-bg);
            color: var(--input-text);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
        }
        .form-label {
            color: var(--text-color);
        }
        
        .text-secondary {
            color: var(--text-secondary) !important;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <script>
        // Apply theme immediately to prevent flashing
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <nav class="navbar">
        <div class="container py-2 d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">toolboxquick</a>
            <div class="d-flex align-items-center gap-3">
                <a class="btn btn-outline-secondary btn-sm border-0" href="/mikrotik" style="color: var(--text-secondary);">MikroTik Panel 📶</a>
                <button id="theme-toggle" class="theme-toggle-btn">
                    <span id="theme-icon">🌙</span> <span id="theme-text">Dark</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer py-3">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <span>toolboxquick &mdash; %100 yerel ve yapay zekasız araçlar</span>
            <span class="mt-2 mt-md-0">Kaan Byzt tarafından geliştirildi &middot; 123apps Modülü</span>
        </div>
    </footer>

    <script>
        const btn = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');

        function updateUI(theme) {
            if (theme === 'light') {
                icon.textContent = '☀️';
                text.textContent = 'Light';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'Dark';
            }
        }

        const currentTheme = localStorage.getItem('theme') || 'dark';
        updateUI(currentTheme);

        btn.addEventListener('click', function() {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = 'dark';
            if (theme === 'dark') {
                newTheme = 'light';
            }
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateUI(newTheme);
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
