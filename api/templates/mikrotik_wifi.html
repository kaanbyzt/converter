{% extends "mikrotik_base.html" %}
{% block title %}{{ t('mk_wifi.title') }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ t('mk_wifi.h1') }}</h1><p>{{ t('mk_wifi.desc') }}</p></div>
<p class="script-warn">{{ t('mk_wifi.top_warning') }}</p>
<div class="tool-grid-4">
    <div class="card card-space">
        <div>
            <label class="form-label">{{ t('mk_wifi.band_label') }}</label>
            <div class="grid-2" style="margin-top:0.25rem;">
                <button id="btn24" class="filter-btn active" style="width:100%;border:1px solid #374151;border-radius:0.4rem;background:#2563eb;color:#fff;" onclick="setBand('2.4')">2.4 GHz</button>
                <button id="btn5" class="filter-btn" style="width:100%;border:1px solid #374151;border-radius:0.4rem;" onclick="setBand('5')">5 GHz</button>
            </div>
        </div>
        <div>
            <label class="form-label">{{ t('mk_wifi.width_label') }}</label>
            <select id="width" class="form-select" onchange="render()">
                <option value="20">{{ t('mk_wifi.opt_20') }}</option>
                <option value="40">{{ t('mk_wifi.opt_40') }}</option>
            </select>
        </div>
    </div>
    <div>
        <h2 style="font-size:1rem;font-weight:600;color:#f9fafb;margin-bottom:1rem;">{{ t('mk_wifi.recommended_title') }}</h2>
        <div id="channels"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let band='2.4';
const DATA={
    '2.4':{20:[{ch:'1',freq:'2412 MHz',s:'ok',desc:{{ t('mk_wifi.d_247_ok')|tojson }}},{ch:'6',freq:'2437 MHz',s:'ok',desc:{{ t('mk_wifi.d_247_ok')|tojson }}},{ch:'11',freq:'2462 MHz',s:'ok',desc:{{ t('mk_wifi.d_247_ok')|tojson }}}],40:[{ch:'1 eC / Ce',freq:'2412 MHz',s:'warn',desc:{{ t('mk_wifi.d_2440_1')|tojson }}},{ch:'6 eC / Ce',freq:'2437 MHz',s:'warn',desc:{{ t('mk_wifi.d_2440_2')|tojson }}}]},
    '5':{20:[{ch:'36',freq:'5180 MHz',s:'ok',desc:{{ t('mk_wifi.d_520_36')|tojson }}},{ch:'40',freq:'5200 MHz',s:'ok',desc:{{ t('mk_wifi.d_520_40')|tojson }}},{ch:'44',freq:'5220 MHz',s:'ok',desc:{{ t('mk_wifi.d_520_44')|tojson }}},{ch:'48',freq:'5240 MHz',s:'ok',desc:{{ t('mk_wifi.d_520_48')|tojson }}}],40:[{ch:'36-40',freq:'5180-5200 MHz',s:'ok',desc:{{ t('mk_wifi.d_540_1')|tojson }}},{ch:'44-48',freq:'5220-5240 MHz',s:'ok',desc:{{ t('mk_wifi.d_540_2')|tojson }}}]}
};
function setBand(b){
    band=b;
    document.getElementById('btn24').style.background=b==='2.4'?'#2563eb':'';document.getElementById('btn24').style.color=b==='2.4'?'#fff':'#9ca3af';
    document.getElementById('btn5').style.background=b==='5'?'#2563eb':'';document.getElementById('btn5').style.color=b==='5'?'#fff':'#9ca3af';
    const ws=document.getElementById('width');ws.innerHTML=`<option value="20">${ {{ t('mk_wifi.opt_20')|tojson }} }</option><option value="40">${ {{ t('mk_wifi.opt_40')|tojson }} }</option>`;
    if(b==='5') ws.innerHTML+=`<option value="80">${ {{ t('mk_wifi.opt_80')|tojson }} }</option>`;
    render();
}
function render(){
    const w=document.getElementById('width').value;
    const chs=(w==='80')?[{ch:'36-48 (Ceee)',freq:'5180-5240 MHz',s:'fast',desc:{{ t('mk_wifi.d_80')|tojson }}}]:(DATA[band][w]||DATA[band][20]);
    document.getElementById('channels').innerHTML=chs.map(c=>`
        <div class="channel-card">
            <div style="display:flex;align-items:center;gap:1rem;">
                <div class="channel-num"><small>${ {{ t('mk_wifi.channel_label')|tojson }} }</small><span>${c.ch}</span></div>
                <div class="channel-info"><small>${c.freq}</small><p>${c.desc}</p></div>
            </div>
            <span class="status-badge ${c.s==='ok'?'badge-ok':c.s==='fast'?'badge-fast':'badge-warn'}">${c.s==='ok'?{{ t('mk_wifi.badge_ok')|tojson }}:c.s==='fast'?{{ t('mk_wifi.badge_fast')|tojson }}:{{ t('mk_wifi.badge_warn')|tojson }}}</span>
        </div>`).join('');
}
render();
</script>
{% endblock %}
