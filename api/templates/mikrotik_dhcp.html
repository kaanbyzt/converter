{% extends "mikrotik_base.html" %}
{% block title %}{{ t('mk_dhcp.title') }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ t('mk_dhcp.heading') }}</h1><p>{{ t('mk_dhcp.intro') }}</p></div>
<div class="tool-grid">
    <div class="card card-space">
        <div><label class="form-label">{{ t('mk_dhcp.label_pool') }}</label><input type="text" id="pool" class="form-input" value="dhcp_havuzu" oninput="update()"></div>
        <div><label class="form-label">{{ t('mk_dhcp.label_range') }}</label><input type="text" id="range" class="form-input" value="192.168.1.100-192.168.1.200" oninput="update()" placeholder="{{ t('mk_dhcp.placeholder_range') }}"></div>
        <div><label class="form-label">{{ t('mk_dhcp.label_iface') }}</label><input type="text" id="iface" class="form-input" value="bridge-local" oninput="update()"></div>
        <div><label class="form-label">{{ t('mk_dhcp.label_gw') }}</label><input type="text" id="gw" class="form-input" value="192.168.1.1" oninput="update()"></div>
        <div><label class="form-label">{{ t('mk_dhcp.label_dns') }}</label><input type="text" id="dns" class="form-input" value="8.8.8.8,1.1.1.1" oninput="update()"></div>
    </div>
    <div class="script-card">
        <div class="script-header"><div class="script-title"><span class="dot"></span>{{ t('mk_dhcp.script_title') }}</div><button class="copy-btn" onclick="copy()">{{ t('mk_dhcp.copy_btn') }}</button></div>
        <p class="script-warn">⚠️ {{ t('mk_dhcp.copy_warning') }}</p>
        <pre id="out" class="script-pre"></pre>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const STEP1 = {{ t('mk_dhcp.comment_pool_step')|tojson }};
const STEP2 = {{ t('mk_dhcp.comment_dhcp_step')|tojson }};
const STEP3 = {{ t('mk_dhcp.comment_network_step')|tojson }};
const LOCAL_LAN_COMMENT = {{ t('mk_dhcp.comment_local_lan')|tojson }};
function update(){
    const pool=document.getElementById('pool').value,range=document.getElementById('range').value,iface=document.getElementById('iface').value,gw=document.getElementById('gw').value,dns=document.getElementById('dns').value;
    const base=gw.substring(0,gw.lastIndexOf('.'))+'.0/24';
    let s=`# ${STEP1}\n/ip pool\nadd name=${pool} ranges=${range}\n\n# ${STEP2}\n/ip dhcp-server\nadd address-pool=${pool} disabled=no interface=${iface} lease-time=10h name="DHCP_Sunucusu"\n\n# ${STEP3}\n/ip dhcp-server network\nadd address=${base} comment="${LOCAL_LAN_COMMENT}" dns-server=${dns} gateway=${gw}\n`;
    document.getElementById('out').textContent=s;
}
function copy(){navigator.clipboard.writeText(document.getElementById('out').textContent);const b=document.querySelector('.copy-btn');b.textContent={{ t('mk_dhcp.copied')|tojson }};setTimeout(()=>b.textContent={{ t('mk_dhcp.copy_btn')|tojson }},1500);}
update();
</script>
{% endblock %}
