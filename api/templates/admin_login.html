{% extends "base.html" %}
{% block title %}Admin Giriş | toolboxquick{% endblock %}
{% block content %}
<div class="d-flex justify-content-center">
    <div class="tool-card p-4" style="max-width: 360px; width: 100%;">
        <h1 class="h5 fw-bold mb-3">Admin Giriş</h1>
        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        <form method="post">
            <div class="mb-3">
                <label class="form-label small">Şifre</label>
                <input type="password" name="password" class="form-control" autofocus required>
            </div>
            <button type="submit" class="btn w-100 fw-semibold text-white" style="background-color:#a855f7; border-color:#a855f7;">Giriş Yap</button>
        </form>
    </div>
</div>
{% endblock %}
