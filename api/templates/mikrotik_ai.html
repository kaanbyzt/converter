{% extends "mikrotik_base.html" %}
{% block title %}AI Asistan{% endblock %}
{% block content %}
<div class="page-header" style="text-align:center; max-width:640px; margin:0 auto 2rem;">
    <h1 style="font-size:2rem;">AI Asistan</h1>
    <p>MikroTik ile ilgili sorularınızı sorun, anında komut ve çözüm önerileri alın.</p>
</div>
<div class="ai-box">
    <form id="ai-form" class="ai-form">
        <input type="text" id="ai-input" class="ai-input" placeholder="Örn: Winbox portunu nasıl değiştiririm?" required>
        <button type="submit" id="ai-btn" class="ai-btn">Sor</button>
    </form>
    <div id="ai-response" class="ai-response" style="display:none;">
        <h2>Yanıt:</h2>
        <div id="ai-body" class="ai-response-body"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderMarkdown(md) {
    // Code blocks
    md = md.replace(/```[\w]*\n?([\s\S]*?)```/g, function(_, c) {
        return '<pre>' + escapeHtml(c.trim()) + '</pre>';
    });
    // Bold
    md = md.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Inline code
    md = md.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Headers
    md = md.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    md = md.replace(/^## (.+)$/gm, '<h3>$1</h3>');
    md = md.replace(/^# (.+)$/gm, '<h3>$1</h3>');
    // Lists
    md = md.replace(/^\* (.+)$/gm, '<li>$1</li>');
    md = md.replace(/^- (.+)$/gm, '<li>$1</li>');
    md = md.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    md = md.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
    // Paragraphs
    md = md.replace(/\n\n/g, '</p><p>');
    return '<p>' + md + '</p>';
}
document.getElementById('ai-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const prompt = document.getElementById('ai-input').value.trim();
    if (!prompt) return;
    const btn = document.getElementById('ai-btn');
    btn.disabled = true;
    btn.textContent = 'Düşünüyor...';
    const respDiv = document.getElementById('ai-response');
    const bodyDiv = document.getElementById('ai-body');
    respDiv.style.display = 'none';
    try {
        const res = await fetch('/mikrotik/api/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        respDiv.style.display = 'block';
        if (data.success) {
            bodyDiv.innerHTML = renderMarkdown(data.text);
        } else {
            bodyDiv.innerHTML = '<p style="color:#f87171">Hata: ' + escapeHtml(data.error || 'Bilinmeyen hata') + '</p>';
        }
    } catch(err) {
        respDiv.style.display = 'block';
        bodyDiv.innerHTML = '<p style="color:#f87171">Sunucuya bağlanırken hata oluştu.</p>';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Sor';
        document.getElementById('ai-input').value = '';
    }
});
</script>
{% endblock %}
